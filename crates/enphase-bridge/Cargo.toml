#:schema https://www.schemastore.org/cargo.json

[package]
name        = "enphase-bridge"
version     = "0.1.0"
description = "Thin Enphase ↔ MQTT bridge exposing the Envoy's controls as Home Assistant entities"
edition     = "2024"
authors     = ["JP-Ellis <josh@jpellis.me>"]
categories  = ["command-line-utilities"]
keywords    = ["enphase", "envoy", "home-assistant", "mqtt", "solar"]
license     = "MIT"
repository  = "https://github.com/JP-Ellis/enphase-api"
publish     = false

[dependencies]
enphase-api = { path = "../.." }

anyhow             = "1.0"
async-trait        = "0.1"
clap               = { version = "4.5", features = ["derive", "env", "string"] }
reqwest            = { version = "0.13", default-features = false }
rumqttc            = "0.24"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
mockall           = "=0.15.0"
pretty_assertions = "=1.4.1"

[lints]
workspace = true
